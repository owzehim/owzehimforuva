<!--
  Supabase → Authentication → Emails → "Reset password" template (SEC-59).
  Paste this whole file as the message body, in the DEV project first, then production.
  Subject suggestion: Reset your UvA-IN password

  The link sends a one-time code (token_hash) that only the app's reset page
  exchanges for a session. Do not use {{ .ConfirmationURL }} any more.
  {{ .RedirectTo }} already ends in "?flow=recovery…", so the link adds "&…".
  Same layout as the sign-in code, password changed and email changed emails.
-->
<div style="margin:0;padding:0;background:#ffffff;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#111111;">
  <div style="max-width:520px;margin:0 auto;padding:44px 32px 56px;">
    <img
      src="https://npvcghdzrtqrlliprtnw.supabase.co/storage/v1/object/public/public-assets/UvA-IN-logo-transparent.png"
      alt="UvA-IN"
      width="44"
      height="44"
      style="display:block;width:44px;height:44px;object-fit:contain;margin:0 0 46px;"
    />

    <h1 style="margin:0 0 34px;font-size:34px;line-height:1.12;font-weight:800;letter-spacing:-0.5px;color:#050505;">
      Reset your password
    </h1>

    <div style="height:1px;background:#e5e7eb;margin-bottom:34px;"></div>

    <p style="margin:0 0 22px;font-size:14px;line-height:1.7;color:#6b7280;">
      You asked to reset the password for your UvA-IN account.
    </p>

    <p style="margin:0 0 26px;font-size:14px;line-height:1.7;color:#6b7280;">
      Tap the button below to choose a new password. The link works once and expires soon.
    </p>

    <p style="margin:0 0 30px;">
      <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery"
         style="display:inline-block;padding:14px 26px;border-radius:999px;background:#111111;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;">
        Choose a new password
      </a>
    </p>

    <p style="margin:0;font-size:13px;line-height:1.6;color:#9ca3af;">
      If you did not request this, you can safely ignore this email. Your password stays the same.
    </p>
  </div>
</div>
