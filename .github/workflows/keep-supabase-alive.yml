name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public restaurants endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY must be configured."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            "${SUPABASE_URL%/}/rest/v1/restaurants?select=id&limit=1" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'accept: application/json')"

          printf '%s' "$response" | jq -e 'type == "array"' >/dev/null
          echo "Supabase public read check succeeded."
