name: Deploy Edge Functions

# Manual deploy of Supabase Edge Functions with the Supabase CLI.
# Production deploys only from `main`, DEV only from `dev`, so each project
# runs exactly the code of its branch. verify_jwt and entry points come from
# supabase/config.toml. Database migrations are NOT run here (README:
# "Database changes and deployment"); apply them first when a function needs them.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Supabase project to deploy to
        type: choice
        options: [dev, production]
        required: true
      functions:
        description: Space-separated function names
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_CLI_VERSION: 2.122.0
    steps:
      - name: Check branch and function names
        env:
          PROJECT: ${{ inputs.project }}
          FUNCTIONS: ${{ inputs.functions }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$PROJECT" == "production" && "$REF_NAME" != "main" ]]; then
            echo "Production deploys only from main (got $REF_NAME)."; exit 1
          fi
          if [[ "$PROJECT" == "dev" && "$REF_NAME" != "dev" ]]; then
            echo "DEV deploys only from dev (got $REF_NAME)."; exit 1
          fi
          for name in $FUNCTIONS; do
            [[ "$name" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid function name: $name"; exit 1; }
          done

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project == 'production' && 'npvcghdzrtqrlliprtnw' || 'smesebnighdcwqcgokhg' }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Set SUPABASE_ACCESS_TOKEN in GitHub Actions secrets."; exit 1
          fi
          for name in $FUNCTIONS; do
            [[ -f "supabase/functions/$name/index.ts" ]] || { echo "No function $name"; exit 1; }
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
          done
